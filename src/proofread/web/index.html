<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proofread — GitHub portfolio evidence</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">GITHUB PORTFOLIO</p>
        <h1>GitHub 활동을<br />검증 가능한 포트폴리오로</h1>
        <p>데이터·인프라·AI 직무에 맞는 코드·문서·운영 신호를 근거와 함께 진단합니다.</p>
      </header>
      <section class="panel" aria-labelledby="analysis-heading">
        <h2 id="analysis-heading">저장소 분석</h2>
        <form id="analysis-form">
          <label for="repository-url">공개 GitHub 저장소 URL</label>
          <input id="repository-url" name="repository-url" type="url" placeholder="https://github.com/owner/repository" required />
          <label for="target-role">지원 직무</label>
          <select id="target-role" name="target-role">
            <option value="data_engineer">데이터 엔지니어</option>
            <option value="infrastructure_engineer">인프라 엔지니어</option>
            <option value="ai_engineer">AI 엔지니어</option>
          </select>
          <button type="submit">분석하기</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <section id="report" class="report" hidden aria-live="polite"></section>
      <section id="codex-feedback" class="panel" hidden aria-live="polite"></section>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
